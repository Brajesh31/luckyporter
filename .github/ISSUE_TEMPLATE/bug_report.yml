name: Bug report
description: Report a reproducible issue in the authorized test workflow
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: environment
    attributes:
      label: OS and Python version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce using non-sensitive sample files
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Observed result and sanitized error output
    validations:
      required: true
